apiVersion: apps/v1
kind: Deployment
metadata:
  name: ponto-backend
  labels:
    app: ponto-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ponto-backend
  template:
    metadata:
      labels:
        app: ponto-backend
    spec:
      containers:
        - name: api
          image: ponto-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 10000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ponto-backend-config
            - secretRef:
                name: ponto-backend-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 384Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
